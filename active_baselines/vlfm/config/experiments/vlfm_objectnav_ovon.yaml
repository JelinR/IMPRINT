defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d          #TODO: For HM3D and OVON
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor

  - /habitat/task/measurements:
    - frontier_exploration_map
    - traveled_stairs
  - /habitat_baselines/rl/policy: vlfm_policy

  #TODO: OVON Added
  - override /habitat/task/lab_sensors:
      - clip_objectgoal_sensor
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
  - _self_

habitat:
  environment:
    max_episode_steps: 500     #TODO: Added. Should be 500 during navigation.
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        # turn_angle: 30
        turn_angle: 20        #TODO: HM3D multi-floor saved nav

      #TODO: OVON Changed
      clip_objectgoal_sensor:
        cache: data/datasets/ovon/text_embeddings/siglip.pkl
    measurements:
      distance_to_goal:
        type: OVONDistanceToGoal

  dataset:

    #HM3D with OVON   
    type: "OVON-v1"       
    split: "val_seen_synonyms"
    scenes_dir: "data/scene_datasets"
    data_path: "data/datasets/ovon/hm3d/val_seen_synonyms_equal/val_unseen_easy.json.gz"

  simulator:

    # agents:
    #   main_agent:
    #     radius: 0.11

    forward_step_size: 0.25     #TODO: HM3D multi-floor saved nav
    turn_angle: 20              #TODO: HM3D multi-floor saved nav

    agents:
      main_agent:
        radius: 0.18

        sim_sensors:
          depth_sensor:
            min_depth: 0.
            max_depth: 10.
            width: 256
            height: 256
            hfov: 90
          rgb_sensor:
            width: 256
            height: 256
            hfov: 90

    #HM3D with OVON
    type: "OVONSim-v0"
    scene_dataset: "data/scene_datasets/hm3d/hm3d_annotated_basis.scene_dataset_config.json"


habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1   
  checkpoint_folder: "data/new_checkpoints"
  #trainer_name: "vlfm"                      #Check out: vlfm -> utils -> vlfm_trainer
  trainer_name: "vlfm_grid"            #TODO: Changed
  num_updates: 270000
  log_interval: 10
  num_checkpoints: 100
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True

  eval:
    split: "val"
    video_option: ["disk"]

  rl:

    policy:
      # name: "HabitatITMPolicyV2"              #Standard VLFM Policy

      name: "HabitatITMPolicy_owlv2"          #Standard VLFM + OwLv2 Detector
      # name: "HabitatITMPolicy_owlv2_Scraped"  #Standard VLFM + OwLv2 Detector + (Text+Image) Features
      # name: "HabitatITMPolicy_owlv2_Scraped_Detect" #Standard VLFM + OwLViT Detector + (Text+Image) Features + Image-Conditioned Detector

      

    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 64
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50

      use_normalized_advantage: False

      hidden_size: 512

    ddppo:
      sync_frac: 0.6
      # The PyTorch distributed backend to use
      distrib_backend: NCCL
      # Visual encoder backbone
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      # Initialize with pretrained weights
      pretrained: False
      # Initialize just the visual encoder backbone with pretrained weights
      pretrained_encoder: False
      # Whether or not the visual encoder backbone will be trained.
      train_encoder: True
      # Whether or not to reset the critic linear layer
      reset_critic: False

      # Model parameters
      backbone: resnet50
      rnn_type: LSTM
      num_recurrent_layers: 2

#TODO: Added
grid_embed:

  #General Args
  rgb_masking: False
  log_dir: logs/junk
  embed_log_dir: embed_results/junk
  should_log_info: True                    
  should_log_embeds: False
  save_trajectory: False
  debug: False
  create_gif: False

  #GUI Nav Args
  gui_nav: False
  only_valid_eps: False
  valid_eps_base_path: "habitat-lab/data/datasets/objectnav/hm3d/v2"
  valid_eps_split: "val"

  #Saved Nav Args
  saved_nav: False